version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quiz-builder-db
    restart: always
    env_file:
      - backend/.env.production
    ports:
      - "5433:5432"
    volumes:
      - quiz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-builder-server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - backend/.env.production
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz-builder-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env.production
    depends_on:
      server:
        condition: service_started

volumes:
  quiz_postgres_data: